AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SnsClub Discord x Lステップ 連携（お客様向けフロー / サーバーレス）

Parameters:
  Stage: { Type: String, Default: prod }
  # 公開URL（デプロイ後に確定する /exec URL。初回はダミー→URL確定後に再デプロイ＋Discord登録）
  WebAppUrl: { Type: String, Default: 'https://example.com/exec' }
  # 機密（NoEcho）。sam deploy --parameter-overrides もしくは samconfig で渡す
  DiscordClientId: { Type: String }
  DiscordClientSecret: { Type: String, NoEcho: true }
  DiscordBotToken: { Type: String, NoEcho: true }
  LstepApiToken: { Type: String, NoEcho: true }
  LstepWebhookSnsclub: { Type: String, NoEcho: true }
  LstepWebhookClasschat: { Type: String, NoEcho: true }
  DiscordAlertWebhookUrl: { Type: String, NoEcho: true, Default: '' }  # 未設定でもデプロイ可（空だと手動対応アラートは飛ばない）
  DiscordAlertThreadId: { Type: String, Default: '1513809205843202100' }
  DiscordAlertMentionId: { Type: String, Default: '1473604738829389875' }
  WritebackToken: { Type: String, NoEcho: true }
  # 旧GASスプシへの即時ミラー（受信専用GAS Web App）。空ならミラー送信しない。
  SheetSinkUrl: { Type: String, Default: '' }
  SheetSinkToken: { Type: String, NoEcho: true, Default: '' }
  # 40333対策（AWSのIPで直接叩けるなら空のままでOK）
  DiscordProxyUrl: { Type: String, Default: '' }
  DiscordProxySecret: { Type: String, NoEcho: true, Default: '' }
  # 書き戻しバッチ（DiscordID→Lステップ）。'1' にすると常にDRY RUN（インポートしない。初回検証用）
  WritebackDryRun: { Type: String, Default: '0', AllowedValues: ['0', '1'] }
  LstepLoginUrl: { Type: String, Default: 'https://manager.linestep.net/' }
  # 操作対象のLステップアカウント名。ログインユーザーが複数アカウントを持つため、違えば自動で切り替える
  LstepAccountName: { Type: String, Default: 'SnsClub運営' }

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 29
    MemorySize: 512
    Architectures: [arm64]
    CodeUri: ./
    Environment:
      Variables:
        MAPPING_TABLE: !Ref MappingTable
        FRIEND_CACHE_BUCKET: !Ref FriendCacheBucket
        WEB_APP_URL: !Ref WebAppUrl
        DISCORD_CLIENT_ID: !Ref DiscordClientId
        DISCORD_CLIENT_SECRET: !Ref DiscordClientSecret
        DISCORD_BOT_TOKEN: !Ref DiscordBotToken
        LSTEP_API_TOKEN: !Ref LstepApiToken
        LSTEP_WEBHOOK_URL_SNSCLUB: !Ref LstepWebhookSnsclub
        LSTEP_WEBHOOK_URL_CLASSCHAT: !Ref LstepWebhookClasschat
        DISCORD_ALERT_WEBHOOK_URL: !Ref DiscordAlertWebhookUrl
        DISCORD_ALERT_THREAD_ID: !Ref DiscordAlertThreadId
        DISCORD_ALERT_MENTION_ID: !Ref DiscordAlertMentionId
        WRITEBACK_TOKEN: !Ref WritebackToken
        SHEET_SINK_URL: !Ref SheetSinkUrl
        SHEET_SINK_TOKEN: !Ref SheetSinkToken
        DISCORD_PROXY_URL: !Ref DiscordProxyUrl
        DISCORD_PROXY_SECRET: !Ref DiscordProxySecret

Resources:
  MappingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: discord_user_id, AttributeType: S }
        - { AttributeName: step, AttributeType: S }
        - { AttributeName: match_status, AttributeType: S }
      KeySchema:
        - { AttributeName: discord_user_id, KeyType: HASH }
        - { AttributeName: step, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: by-status
          KeySchema:
            - { AttributeName: match_status, KeyType: HASH }
            - { AttributeName: discord_user_id, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Lステップ友だち一覧キャッシュ（〜1MB超のためS3）
  FriendCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-cache
            Status: Enabled
            ExpirationInDays: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/match.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref MappingTable }
        - S3CrudPolicy: { BucketName: !Ref FriendCacheBucket }

  ExecFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/exec.handler
      Environment:
        Variables:
          MATCH_FUNCTION_NAME: !Ref MatchFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref MappingTable }
        - S3CrudPolicy: { BucketName: !Ref FriendCacheBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref MatchFunction }
      Events:
        Exec:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /exec, Method: GET }

  WritebackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/writeback.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref MappingTable }
      Events:
        Writeback:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /writeback, Method: GET }

  # ============================================================
  # 書き戻しバッチ（DiscordID→Lステップ）: 旧 lstep-discord-writeback/（Mac・launchd 22時）のAWS版
  #   毎日22時(JST)に Lambda 内のヘッドレス Chromium で Lステップ管理画面を操作し、
  #   export → DiscordID充填 → import を行う。Macは不要。
  #   人が関与するのはログイン(CAPTCHA)のみ: セッション切れは Discord に通知され、
  #   担当者が writeback-batch/scripts/session-login.js でセッションを保存し直す。
  # ============================================================
  WritebackBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-run-artifacts   # 実行ごとのCSV/スクショは90日で消す（session/ は残す）
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 90

  WritebackBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: writeback-batch/       # 依存(Chromium ~60MB)が大きいので他の関数と分離
      Handler: src/handler.handler
      Architectures: [x86_64]         # @sparticuz/chromium は x86_64 のみ対応
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 1024 } # Chromium展開 + CSV
      Environment:
        Variables:
          WRITEBACK_BUCKET: !Ref WritebackBucket
          WRITEBACK_MAP_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/writeback?token=${WritebackToken}"
          WRITEBACK_DRY_RUN: !Ref WritebackDryRun
          LSTEP_LOGIN_URL: !Ref LstepLoginUrl
          LSTEP_ACCOUNT_NAME: !Ref LstepAccountName
      Policies:
        - S3CrudPolicy: { BucketName: !Ref WritebackBucket }
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 22 * * ? *)
            ScheduleExpressionTimezone: Asia/Tokyo
            Description: DiscordID→Lステップ書き戻し（毎日22時JST）
            RetryPolicy: { MaximumRetryAttempts: 0 }   # 二重インポート防止。失敗は翌日再実行

Outputs:
  ApiBaseUrl:
    Description: 公開ベースURL。/exec をLステップ配信URL・Discordリダイレクト・WebAppUrlに、/writeback を書き戻しmap-urlに使う
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  WritebackBucketName:
    Description: 書き戻しバッチのセッション・成果物バケット。session-login.js の --bucket に指定する
    Value: !Ref WritebackBucket
  WritebackBatchFunctionName:
    Description: 書き戻しバッチのLambda名。手動実行は aws lambda invoke --function-name <これ> --payload '{"dryRun":true}'
    Value: !Ref WritebackBatchFunction
